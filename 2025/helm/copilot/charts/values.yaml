# Default values for copilot-service
replicaCount: 1

image:
  name: copilot-service
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080
  containerPort: 8080

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: PORT
    value: "8080"

livenessProbe:
  path: "/healthcheck"
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  path: "/healthcheck" 
  initialDelaySeconds: 5
  periodSeconds: 5